# marcovanthiel.nl — Cloudflare Workers Static Assets (puur statisch).
# Hugo bouwt de site naar ./public (build in CI: hugo --minify, Hugo 0.161.1;
# het theme vereist een moderne Hugo, de oude HUGO_VERSION 0.92.2 was verouderd).
# Geen Worker-code: de site heeft geen dynamische endpoints. "Kunstwerk van de
# dag" is client-side en haalt de EXTERNE kunstcollectie-API op (zie CSP in
# static/_headers). Deploy via GitHub Actions (push naar main); custom domains
# via de Workers-API (niet hier: een route schakelt workers.dev uit -> error 1042).
name = "marcovanthiel-static"
compatibility_date = "2026-07-01"
workers_dev = true

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
