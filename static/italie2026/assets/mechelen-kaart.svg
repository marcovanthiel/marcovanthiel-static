<svg viewBox="0 0 520 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematische plattegrond van Mechelen met de programmapunten 1 tot 5, parkeergarage P en de alternatieven A tot D, met een cirkel van 300 meter rond het hotel">
  <!-- Handgetekende, schematische kaart: posities op schaal (1 m = 0,36 px),
       rivierloop indicatief. Gegenereerd/onderhouden met de hand; kleuren
       volgen het Midnight-palet van de site. -->
  <g fill="none">
    <path d="M 310 30 C 290 120, 258 190, 248 250 C 240 300, 210 325, 208 370 C 207 415, 255 455, 320 500 C 355 525, 380 545, 398 565"
          stroke="#02a0a0" stroke-opacity="0.32" stroke-width="14" stroke-linecap="round"/>
    <circle cx="230" cy="360" r="108" stroke="#ff9c85" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.9"/>
  </g>
  <text x="330" y="482" fill="#4ccfcf" fill-opacity="0.75" font-size="11" letter-spacing="3">DIJLE</text>
  <text x="96" y="266" fill="#ff9c85" font-size="11">
    <tspan class="lang lang-nl">300 m vanaf het hotel</tspan><tspan class="lang lang-zh">距酒店 300 米</tspan>
  </text>

  <!-- programmapunten (turquoise) -->
  <g font-size="12" text-anchor="middle" font-weight="700">
    <circle cx="230" cy="360" r="10" fill="#02a0a0"/><text x="230" y="364" fill="#071317">1</text>
    <circle cx="385" cy="215" r="10" fill="#02a0a0"/><text x="385" y="219" fill="#071317">2</text>
    <circle cx="250" cy="275" r="10" fill="#02a0a0"/><text x="250" y="279" fill="#071317">3</text>
    <circle cx="262" cy="292" r="10" fill="#02a0a0"/><text x="262" y="296" fill="#071317">4</text>
    <circle cx="213" cy="383" r="10" fill="#02a0a0"/><text x="213" y="387" fill="#071317">5</text>
    <rect x="230" y="322" width="17" height="17" rx="3" fill="#8ba5a6"/><text x="238.5" y="335" fill="#071317">P</text>
  </g>
  <!-- alternatieven (oranje) -->
  <g font-size="12" text-anchor="middle" font-weight="700">
    <circle cx="350" cy="232" r="10" fill="#ffbd65"/><text x="350" y="236" fill="#071317">A</text>
    <circle cx="300" cy="95" r="10" fill="#ffbd65"/><text x="300" y="99" fill="#071317">B</text>
    <circle cx="75" cy="205" r="10" fill="#ffbd65"/><text x="75" y="209" fill="#071317">C</text>
    <circle cx="390" cy="555" r="10" fill="#ffbd65"/><text x="390" y="559" fill="#071317">D</text>
  </g>

  <!-- labels -->
  <g fill="#e9f2f1" font-size="12">
    <text x="246" y="364">Hotel Vé · Vismarkt</text>
    <text x="401" y="219">Busleyden</text>
    <text x="266" y="271">Sint-Rombouts</text>
    <text x="278" y="297">Carlton</text>
    <text x="228" y="394">Bootjes · Haverwerf</text>
    <text x="253" y="336">Q-Park Lamot</text>
    <text x="366" y="236">Sint-Janskerk</text>
    <text x="316" y="99">Het Predikheren</text>
    <text x="91" y="209">Het Anker</text>
    <text x="340" y="572">Kruidtuin</text>
  </g>

  <!-- schaalbalk: 200 m = 72 px -->
  <g stroke="#8ba5a6" stroke-width="1.5">
    <line x1="40" y1="596" x2="112" y2="596"/>
    <line x1="40" y1="591" x2="40" y2="601"/>
    <line x1="112" y1="591" x2="112" y2="601"/>
  </g>
  <text x="48" y="588" fill="#8ba5a6" font-size="11">200 m</text>
</svg>
