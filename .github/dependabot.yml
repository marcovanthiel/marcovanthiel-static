# Dependabot — wekelijks (maandagochtend). Minor/patch gegroepeerd; majors apart.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    cooldown:
      default-days: 5
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Amsterdam'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    cooldown:
      default-days: 5
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Amsterdam'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'deps(ci)'
