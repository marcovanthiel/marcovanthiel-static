name: europeanopen-hourly

on:
  schedule:
    # Alleen tijdens het toernooivenster: 15 t/m 26 oktober, van lotingsdag
    # (± vr 16 okt) t/m de dag na de finale (25 okt). Buiten dat venster
    # verandert data.json niet: vóór het toernooi staat het voorfase-kader
    # erin en na EINDDATUM (26-10-2026) doet update.py niets meer.
    # Live verversen gebeurt sowieso in de browser — static/europeanopen/
    # index.html haalt de ESPN-feed elke 5 minuten zelf op — dus tussen de
    # toernooien is een uurlijkse run puur verbruik.
    # Datums per jaar bijstellen als het toernooi verschuift.
    - cron: "7 * 15-26 10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Genereer data.json
        run: python3 scripts/europeanopen/update.py
      - name: Commit bij wijziging
        run: |
          if ! git diff --quiet static/europeanopen/data.json; then
            git config user.name "europeanopen-bot"
            git config user.email "actions@github.com"
            git add static/europeanopen/data.json
            git commit -m "europeanopen: data.json ververst"
            git pull --rebase origin main
            git push
          else
            echo "Geen wijzigingen."
          fi
